# 로컬 개발용 MySQL. 운영 Cloud SQL(MySQL 8.4)과 버전과 DB·사용자 이름을 맞춘다.
# 시간대는 운영 Cloud SQL(default_time_zone=+09:00)과 같은 한국 시간으로 둔다.
# 비밀번호는 .env(커밋 금지)에 넣으면 그 값을, 없으면 아래 로컬 전용 기본값을 쓴다. 예시는 .env.example 참고.
# 기본값을 써도 되는 이유: 포트를 127.0.0.1에만 열어 이 PC 밖에서는 접속할 수 없다.
# ./gradlew bootRun이 이 파일로 컨테이너를 자동으로 띄우고 접속 정보도 여기서 읽는다(spring-boot-docker-compose).
#
# 변수 이름에 SAEMGIL_ 접두어를 붙인다. DB_PASSWORD처럼 흔한 이름은 개발 PC의 OS 환경변수와 겹치면
# .env보다 OS 값이 우선해 비밀번호가 틀어진다.
services:
  mysql:
    image: mysql:8.4
    container_name: saemgil-mysql
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: saemgil
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${SAEMGIL_DB_PASSWORD:-saemgil-local}
      MYSQL_ROOT_PASSWORD: ${SAEMGIL_DB_ROOT_PASSWORD:-saemgil-local-root}
    ports:
      # PC에 직접 설치한 MySQL(보통 3306)과 겹치지 않도록 3307을 쓴다. 3307도 쓰고 있으면 .env에서 바꾼다.
      # 127.0.0.1: 이 PC에서만 접속할 수 있다(같은 네트워크의 다른 PC에서는 접속 불가).
      - '127.0.0.1:${SAEMGIL_DB_PORT:-3307}:3306'
    volumes:
      - saemgil-mysql-data:/var/lib/mysql

volumes:
  saemgil-mysql-data:
