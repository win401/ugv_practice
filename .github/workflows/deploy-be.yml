name: Deploy BE

on:
  push:
    branches: [main]
    paths:
      - "BE/**"
      - ".github/workflows/deploy-be.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  SERVICE: toy-api-github
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy/actions/toy-api-github:${{ github.sha }}
  RUNTIME_SA: toy-api-runner@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  DB_INSTANCE: ${{ vars.GCP_PROJECT_ID }}:us-central1:ugv-db

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker login to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build
        run: docker build -t $IMAGE BE

      - name: Push
        run: docker push $IMAGE

      - name: Deploy
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE \
            --region $REGION \
            --service-account $RUNTIME_SA \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars INSTANCE_CONNECTION_NAME=$DB_INSTANCE,DB_USER=app,DB_NAME=todo_db \
            --set-secrets DB_PASS=db-password:latest \
            --quiet
