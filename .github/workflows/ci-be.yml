name: CI BE

on:
  pull_request:
    branches: [main]
    paths:
      - "BE/**"
      - ".github/workflows/ci-be.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: pytest