name: CI BE

on:
  pull_request:
    branches: [main]
    paths:
      - "BE/**"
      - ".github/workflows/ci-be.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Test
        run: ./gradlew test --no-daemon
